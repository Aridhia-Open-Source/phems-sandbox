apiVersion: v1
kind: ConfigMap
metadata:
  name: celery-config
  namespace: dagster
data:
  job_spec.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: dagster-run-worker-template
    spec:
      template:
        metadata:
          labels:
            dagster-worker: celery
        spec:
          restartPolicy: Never
          containers:
            - name: dagster-run-worker
              image: phems-dagster:v34
              command: [
                "dagster-celery", "worker",
                "--app", "app.worker",
                "--loglevel", "INFO",
                "--concurrency", "1",
                "--queues", "dagster"
              ]
              envFrom:
                - configMapRef:
                    name: dagster-environment-config
              volumeMounts:
                - name: dagster-config
                  mountPath: /opt/dagster/home/dagster.yaml
                  subPath: dagster.yaml
          volumes:
            - name: dagster-config
              configMap:
                name: dagster-config
