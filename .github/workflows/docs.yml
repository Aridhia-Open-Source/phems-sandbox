name: Docs

on:
  pull_request:
    paths:
      - "wiki/**"
      - "wiki-2x/**"
      - "mkdocs.yml"
      - "mkdocs-2x.yml"
      - "docs-requirements.txt"
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - "wiki-2x/**"
      - "mkdocs.yml"
      - "mkdocs-2x.yml"
      - "docs-requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: pip install -r docs-requirements.txt
      - run: mkdocs build --strict
      - name: Build 2.x (non-strict)
        run: mkdocs build -f mkdocs-2x.yml --site-dir site-2x
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One docs deploy at a time; the newest wins. The chart release (build.yml) also pushes
    # gh-pages, so the deploy retries on a rejected push instead of sharing a lock with it.
    concurrency:
      group: docs-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: pip install -r docs-requirements.txt
      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy 1.x and 2.x to gh-pages docs/docs
        run: |
          # Commit onto the latest gh-pages and push; if the release job pushed in between,
          # start again from the new gh-pages, up to 5 times.
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages --depth=1
            git branch -f gh-pages FETCH_HEAD
            mike deploy --deploy-prefix docs/docs --update-aliases 1.x
            mike deploy -F mkdocs-2x.yml --deploy-prefix docs/docs --update-aliases 2.x latest
            mike set-default --deploy-prefix docs/docs latest
            # Drop the old demo version.
            mike delete --deploy-prefix docs/docs 2.x-preview || true
            if git push origin gh-pages; then
              exit 0
            fi
            echo "gh-pages moved, retrying ($attempt/5)"
            sleep $((attempt * 5))
          done
          exit 1
