storage:
  postgres:
    postgres_db:
      db_name: "postgres_db"
      username: "postgres_user"
      password: "postgres_password"
      hostname: "postgres"
      port: 5432

run_launcher:
  module: dagster_k8s.launcher
  class: CeleryK8sRunLauncher
  config:
    instance_config_map: "dagster-k8s-instance-config-map"
    dagster_home: "/opt/dagster/home/"
    broker: "amqp://rabbit:rabbit@rabbitmq:5672/dagster"
    backend: "db+postgresql://postgres_user:postgres_password@postgres/postgres_db"
    image_pull_policy: "IfNotPresent"
    job_image: "phems-dagster:latest"
    job_namespace: "phems"

