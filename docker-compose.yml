name: phems-dagster

services:
  postgres:
    image: postgres:11
    container_name: postgres
    environment:
      POSTGRES_USER: 'postgres_user'
      POSTGRES_PASSWORD: 'postgres_password'
      POSTGRES_DB: 'postgres_db'
    networks:
      - phems-network
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres_user -d postgres_db']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
    networks:
      - phems-network
    volumes:
      - dagster_rabbitmq_data:/var/lib/rabbitmq

  # test-rabbitmq-client:
  #   image: python:3
  #   container_name: test-rabbitmq-client
  #   depends_on:
  #     - rabbitmq
  #   networks:
  #     - phems-network
  #   command: bash -c "pip install pika && python -c \"import pika; connection = pika.BlockingConnection(pika.ConnectionParameters(host='rabbitmq', credentials=pika.PlainCredentials('rabbit', 'rabbit'))); print('Connection successful'); connection.close()\""

  # minio:
  #   image: minio/minio
  #   container_name: minio
  #   ports:
  #     - '9000:9000'
  #   volumes:
  #     - dagster_minio_storage:/data
  #   environment:
  #     MINIO_ACCESS_KEY: 'minio'
  #     MINIO_SECRET_KEY: 'miniosecret'
  #   command: 'server /data'
  #   networks:
  #     - phems-network

  codeserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: phems-dagster
    restart: always
    container_name: codeserver
    environment:
      DAGSTER_POSTGRES_USER: 'postgres_user'
      DAGSTER_POSTGRES_PASSWORD: 'postgres_password'
      DAGSTER_POSTGRES_DB: 'postgres_db'
    networks:
      - phems-network
    volumes:
      - ./app:/opt/dagster/home/app
    command: >
      dagster code-server start
      -h 0.0.0.0
      -p 4000
      -f app/definitions.py

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webserver
    command: >
      dagster-webserver
      -h 0.0.0.0
      -p 3000
      -w workspace.yaml
    expose:
      - '3000'
    ports:
      - '3000:3000'
    environment:
      DAGSTER_POSTGRES_USER: 'postgres_user'
      DAGSTER_POSTGRES_PASSWORD: 'postgres_password'
      DAGSTER_POSTGRES_DB: 'postgres_db'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
      - ./app:/opt/dagster/home/app
    networks:
      - phems-network
    depends_on:
      postgres:
        condition: service_healthy
      codeserver:
        condition: service_started

  daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daemon
    command: >
      dagster-daemon run
    restart: on-failure
    environment:
      DAGSTER_POSTGRES_USER: 'postgres_user'
      DAGSTER_POSTGRES_PASSWORD: 'postgres_password'
      DAGSTER_POSTGRES_DB: 'postgres_db'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
      - ./app:/opt/dagster/home/app
    networks:
      - phems-network
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker
    command: >
      dagster-celery worker start
      --app app.worker
      --config-yaml celery.yaml
      --loglevel=info
      --queue=dagster
    networks:
      - phems-network
    depends_on:
      - rabbitmq
      - postgres
      # - minio
    volumes:
      - ./app:/opt/dagster/home/app

  flower:
    image: mher/flower
    container_name: flower
    command: celery flower --config-yaml celery.yaml
    # environment:
    #   - CELERY_BROKER_URL="amqp://rabbit:rabbit@rabbitmq:5672//"
    #   - CELERY_RESULT_BACKEND="db+postgresql://postgres_user:postgres_password@postgres/postgres_db"
    ports:
      - "5555:5555"
    volumes:
      - ./app:/opt/dagster/home/app
    networks:
      - phems-network
    depends_on:
      - rabbitmq
      - postgres

networks:
  phems-network:
    driver: bridge
    name: phems-network

volumes:
  dagster_postgres_data:
  dagster_rabbitmq_data:
  # dagster_minio_storage:
