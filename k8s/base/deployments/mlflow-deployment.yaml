apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: dagster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: dagster-user-code
      initContainers:
      - name: create-mlflow-db
        image: postgres:15
        command: ["sh", "-c"]
        args:
          - |
            echo "Ensuring database $POSTGRES_DB exists..."
            psql -h postgres -U "$POSTGRES_USER" -d postgres -tc \
              "SELECT 1 FROM pg_database WHERE datname = '$POSTGRES_DB'" \
              | grep -q 1 || \
              psql -h postgres -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE $POSTGRES_DB OWNER $POSTGRES_USER;"
        envFrom:
          - secretRef:
              name: mlflow-secret
        env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: mlflow-secret
                key: POSTGRES_PASSWORD
      containers:
      - name: mlflow
        image: bitnami/mlflow:latest
        command: ["sh", "-c"]
        args:
          - |
            mlflow server \
              --host 0.0.0.0 \
              --port 5000 \
              --backend-store-uri $MLFLOW_BACKEND_STORE_URI \
              --default-artifact-root $MLFLOW_DEFAULT_ARTIFACT_ROOT
        ports:
        - containerPort: 5000
        envFrom:
          - secretRef:
              name: mlflow-secret
