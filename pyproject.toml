[project]
name = "phems-sandbox"
description = "A PHEMS sandbox repository for testing and development purposes."
authors = [{ name = "George Eddie", email = "george.eddie@aridhia.com" }]
version = "0.1.0"
requires-python = ">=3.6"
dependencies = [
    "dagster",
    "pytest",
    "python-dotenv",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=42",
    "wheel"
]

[tool.setuptools.packages.find]
where = ["app"]

[project.scripts]
main = "app.main"

[tool.pytest.ini_options]
pythonpath = ["app"]
addopts = "-p no:cacheprovider"

[tool.setuptools]
py-modules = []