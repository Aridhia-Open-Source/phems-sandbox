apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeserver
  namespace: dagster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codeserver
  template:
    metadata:
      labels:
        app: codeserver
    spec:
      serviceAccountName: dagster-user-code
      containers:
        - name: codeserver
          image: phems-dagster:v174
          imagePullPolicy: Never
          command: [
            "dagster", "code-server", "start",
            "--working-directory", "/opt/dagster/home/",
            "--python-file", "app/definitions",
            "-h", "0.0.0.0",
            "-p", "4000",
          ]
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: dagster-env-config
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster/home/dagster.yaml
              subPath: dagster.yaml
            - name: app-volume
              mountPath: /opt/dagster/home/app
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-config
        - name: app-volume
          emptyDir: {}
