apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-config
  namespace: dagster
data:
  dagster.yaml: |
    storage:
      postgres:
        postgres_db:
          db_name: postgres_db
          username: postgres_user
          password: postgres_password
          hostname: postgres
          port: 5432

    run_launcher:
      module: dagster_celery_k8s.launcher
      class: CeleryK8sRunLauncher
      config:
        dagster_home: /opt/dagster/home
        broker:
          env: DAGSTER_CELERY_BROKER_URL
        volumes:
          - name: job
            configMap: celery-config
        volume_mounts:
          - name: job
            mountPath: /opt/dagster/home
            subPath: job_spec.yaml
        instance_config_map: dagster-config
        backend:
          env: DAGSTER_CELERY_BACKEND_URL
        job_namespace: dagster
        load_incluster_config: true
        postgres_password_secret: postgres-secret
