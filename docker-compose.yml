name: phems-dagster

services:
  postgres:
    image: postgres:11
    container_name: postgres
    environment:
      POSTGRES_USER: 'postgres_user'
      POSTGRES_PASSWORD: 'postgres_password'
      POSTGRES_DB: 'postgres_db'
    networks:
      - phems-network
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres_user -d postgres_db']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    networks:
      - phems-network

  codeserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: phems-dagster
    restart: always
    environment:
      DAGSTER_POSTGRES_USER: 'postgres_user'
      DAGSTER_POSTGRES_PASSWORD: 'postgres_password'
      DAGSTER_POSTGRES_DB: 'postgres_db'
      DAGSTER_CURRENT_IMAGE: 'phems-dagster'
    networks:
      - phems-network
    volumes:
      - ./app:/opt/dagster/home/app
    command: >
      dagster code-server start
      -h 0.0.0.0
      -p 4000
      -f definitions.py

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      dagster-webserver
      -h 0.0.0.0
      -p 3000
      -w workspace.yaml
    expose:
      - '3000'
    ports:
      - '3000:3000'
    environment:
      DAGSTER_POSTGRES_USER: 'postgres_user'
      DAGSTER_POSTGRES_PASSWORD: 'postgres_password'
      DAGSTER_POSTGRES_DB: 'postgres_db'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
      - ./app:/opt/dagster/home/app
      - dagster_artifacts:/opt/dagster/home/artifacts
    networks:
      - phems-network
    depends_on:
      postgres:
        condition: service_healthy
      codeserver:
        condition: service_started

  daemon:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint:
      - dagster-daemon
      - run
    restart: on-failure
    environment:
      DAGSTER_POSTGRES_USER: 'postgres_user'
      DAGSTER_POSTGRES_PASSWORD: 'postgres_password'
      DAGSTER_POSTGRES_DB: 'postgres_db'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
      - ./app:/opt/dagster/home/app
      - dagster_artifacts:/opt/dagster/home/artifacts
    networks:
      - phems-network
    depends_on:
      postgres:
        condition: service_healthy
      webserver:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.worker worker --loglevel=INFO
    environment:
      DAGSTER_CURRENT_IMAGE: 'phems-dagster'
      DAGSTER_CELERY_BROKER_URL: 'pyamqp://guest@rabbitmq//'
    networks:
      - phems-network
    depends_on:
      - rabbitmq
    volumes:
      - ./app:/opt/dagster/home/app

  flower:
    image: mher/flower
    container_name: flower
    environment:
      - CELERY_BROKER_URL=amqp://guest@rabbitmq//
    ports:
      - "5555:5555"
    networks:
      - phems-network
    depends_on:
      - rabbitmq
      - postgres

networks:
  phems-network:
    driver: bridge
    name: phems-network

volumes:
  dagster_postgres_data:
  dagster_artifacts: