site_name: Federated Node
site_url: https://aridhia-open-source.github.io/phems-sandbox/docs/
repo_url: https://github.com/Aridhia-Open-Source/phems-sandbox
docs_dir: wiki-2x

plugins:
  - search
  - swagger-ui-tag

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  version:
    provider: mike

validation:
  anchors: warn

nav:
  - Home: index.md
  - Deploy:
      - Prerequisites: Prerequisites.md
      - Core deployment: Deploy-Core.md
      - Azure (AKS): Deploy-Azure.md
      - AWS (EKS): Deploy-AWS.md
      - GCP: Deploy-GCP.md
      - On-Premises: Deploy-On-Premises.md
      - Post-deploy testing: Post-Deploy-Testing.md
  - Use:
      - Researcher guide: Researcher-Guide.md
      - Datasets: Datasets.md
      - Using the API: Using-The-API.md
  - Operate:
      - Operations: Operations.md
  - Develop:
      - Architecture: Architecture.md
      - Analytics container development: Analytics-Container-Development.md
  - API reference: api/index.md
