[project]
name = "phems-sandbox"
description = "A PHEMS sandbox repository for testing and development purposes."
authors = [{ name = "George Eddie", email = "george.eddie@aridhia.com" }]
version = "0.1.0"
requires-python = ">=3.6"
dependencies = [
    "dagster",
    "dagster-celery",
    "dagster-celery[rabbitmq]",
    "celery",
    "pytest",
    "python-dotenv",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=42",
    "wheel"
]

[tool.setuptools.packages.find]
where = ["app"]
exclude = ["app/tests"]

[tool.dagster]
module_name = "app.definitions"
code_location_name = "app"

[tool.pytest.ini_options]
pythonpath = ["app"]
addopts = "-p no:cacheprovider"

