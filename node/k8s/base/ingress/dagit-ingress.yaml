apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dagit-ingress
  namespace: node
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/enable-admission-webhook: "false"
spec:
  rules:
    - host: localhost
      http:
        paths:
          - path: /dagit
            pathType: Prefix
            backend:
              service:
                name: dagit
                port:
                  number: 3000
