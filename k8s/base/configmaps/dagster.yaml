storage:
  postgres:
    postgres_db:
      db_name: postgres_db
      username: postgres_user
      password: postgres_password
      hostname: postgres
      port: 5432

run_launcher:
  module: dagster_k8s.launcher
  class: CeleryK8sRunLauncher
  config:
    instance_config_map: dagster-instance
    dagster_home: /opt/dagster/home
    postgres_password_secret: postgres-secret
    broker: amqp://rabbit:rabbit@rabbitmq:5672/dagster
    backend: db+postgresql://postgres_user:postgres_password@postgres/postgres_db
    job_image: phems-dagster:latest
    job_namespace: dagster
    config_map: celery-worker
    load_incluster_config: true
