apiVersion: batch/v1
kind: Job
metadata:
  name: dagster-worker-template
spec:
  template:
    metadata:
      labels:
        dagster-worker: celery
    spec:
      restartPolicy: Never
      containers:
        - name: dagster-worker
          image: phems-dagster
          command: ["dagster-celery", "worker", "--app", "app.worker", "--loglevel", "INFO", "--concurrency", "1", "--queues", "dagster"]
          env:
            - name: DAGSTER_HOME
              value: /opt/dagster/home
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster/home/dagster.yaml
              subPath: dagster.yaml
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-config
