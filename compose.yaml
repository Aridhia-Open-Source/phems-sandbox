name: phems-dagster

services:
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: 'postgres_user'
      POSTGRES_PASSWORD: 'postgres_password'
      POSTGRES_DB: 'postgres_db'
    networks:
      - phems-network
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres_user -d postgres_db']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
      RABBITMQ_DEFAULT_VHOST: dagster
    networks:
      - phems-network
    volumes:
      - dagster_rabbitmq_data:/var/lib/rabbitmq
    command:
      - /bin/bash
      - -c
      - |
        rabbitmq-server &
        sleep 5
        rabbitmqctl set_permissions -p / rabbit '.*' '.*' '.*'
        wait


  codeserver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: codeserver
    # environment:
    #   DAGSTER_POSTGRES_USER: 'postgres_user'
    #   DAGSTER_POSTGRES_PASSWORD: 'postgres_password'
    #   DAGSTER_POSTGRES_DB: 'postgres_db'
    networks:
      - phems-network
    volumes:
      - ./app:/opt/dagster/home/app
      - ./dagster.yaml:/opt/dagster/home/dagster.yaml:ro
    command: >
      dagster code-server start
      -h 0.0.0.0
      -p 4000
      -f app/definitions.py

  daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daemon
    command: >
      dagster-daemon run
    restart: on-failure
    volumes:
      - ./app:/opt/dagster/home/app
      - ./dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      #   - /var/run/docker.sock:/var/run/docker.sock
      #   - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - phems-network
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker
    command: >
      dagster-celery worker start
      --app app.worker
      --config-yaml celery.yaml
      --loglevel info
      --queue dagster
    volumes:
      - ./app:/opt/dagster/home/app
      - ./dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./celery.yaml:/opt/dagster/home/celery.yaml:ro
    networks:
      - phems-network
    depends_on:
      - rabbitmq
      - postgres
      # - minio

  dagit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dagit
    command: >
      dagster-webserver
      -h 0.0.0.0
      -p 3000
      -w workspace.yaml
    expose:
      - '3000'
    ports:
      - '3000:3000'
    volumes:
      - ./app:/opt/dagster/home/app
      - ./dagster.yaml:/opt/dagster/home/dagster.yaml:ro
    networks:
      - phems-network
    depends_on:
      postgres:
        condition: service_healthy
      codeserver:
        condition: service_started

  flower:
    image: mher/flower
    container_name: flower
    environment:
      - CELERY_BROKER_URL=pyamqp://rabbit:rabbit@rabbitmq:5672/dagster
      - CELERY_RESULT_BACKEND=db+postgresql://postgres_user:postgres_password@postgres/postgres_db
    ports:
      - "5555:5555"
    networks:
      - phems-network
    depends_on:
      - rabbitmq
      - postgres

  # test-rabbitmq-client:
  #   image: python:3
  #   container_name: test-rabbitmq-client
  #   depends_on:
  #     - rabbitmq
  #   networks:
  #     - phems-network
  #   command: bash -c "pip install pika && python -c \"import pika; connection = pika.BlockingConnection(pika.ConnectionParameters(host='rabbitmq', credentials=pika.PlainCredentials('rabbit', 'rabbit'))); print('Connection successful'); connection.close()\""

  # minio:
  #   image: minio/minio
  #   container_name: minio
  #   ports:
  #     - '9000:9000'
  #   volumes:
  #     - dagster_minio_storage:/data
  #   environment:
  #     MINIO_ACCESS_KEY: 'minio'
  #     MINIO_SECRET_KEY: 'miniosecret'
  #   command: 'server /data'
  #   networks:
  #     - phems-network

networks:
  phems-network:
    driver: bridge
    name: phems-network

volumes:
  dagster_postgres_data:
  dagster_rabbitmq_data:
  # dagster_minio_storage:
