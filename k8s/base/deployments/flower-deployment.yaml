apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowermon
  namespace: dagster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      containers:
        - name: flowermon
          image: mher/flower
          ports:
            - containerPort: 5555
          envFrom:
            - secretRef:
                name: flower-secret
          env:
            - name: FLOWER_PORT
              value: "5555"