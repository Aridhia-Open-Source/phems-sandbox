apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-environment-config
  namespace: dagster
data:
  DAGSTER_CELERY_BROKER_URL: amqp://rabbit:rabbit@rabbitmq:5672/dagster
  DAGSTER_CELERY_BACKEND_URL: db+postgresql://postgres_user:postgres_password@postgres/postgres_db
  DAGSTER_MINIO_BUCKET: phems-bucket
  DAGSTER_MINIO_IO_PREFIX: io
  DAGSTER_MINIO_ENDPOINT: http://minio:9000
  DAGSTER_MINIO_ACCESS_KEY: minio
  DAGSTER_MINIO_SECRET_KEY: miniosecret
  DAGSTER_CURRENT_IMAGE: phems-dagster:v25
