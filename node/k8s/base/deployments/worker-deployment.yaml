apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: node
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: dagster-user-code
      containers:
        - name: worker
          image: phems-code:v26
          command: [
            "dagster-celery", "worker", "start",
              "--app", "app.worker",
              "--loglevel", "INFO",
              "--queue", "dagster",
          ]
          envFrom:
            - configMapRef:
                name: dagster-env-config
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster/home/dagster.yaml
              subPath: dagster.yaml
            - name: artifacts-pvc
              mountPath: /mnt/dagster/artifacts
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-config
        - name: artifacts-pvc
          persistentVolumeClaim:
            claimName: artifacts-pvc