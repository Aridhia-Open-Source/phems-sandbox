apiVersion: apps/v1
kind: Deployment
metadata:
  name: daemon
  namespace: dagster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daemon
  template:
    metadata:
      labels:
        app: daemon
    spec:
      initContainers:
      - name: create-mlflow-db
        image: postgres:15
        command: ["sh", "-c"]
        args:
          - |
            echo "Ensuring database $POSTGRES_DB exists..."
            psql -h postgres -U "$POSTGRES_USER" -d postgres -tc \
              "SELECT 1 FROM pg_database WHERE datname = '$POSTGRES_DB'" \
              | grep -q 1 || \
              psql -h postgres -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE $POSTGRES_DB OWNER $POSTGRES_USER;"
        envFrom:
          - secretRef:
              name: mlflow-secret
        env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: mlflow-secret
                key: POSTGRES_PASSWORD
      containers:
        - name: daemon
          image: phems-dagster:v118
          command: [
            "dagster-daemon", "run",
            "--working-directory", "/opt/dagster/home/",
            "--python-file", "app/definitions"
          ]
          envFrom:
            - configMapRef:
                name: dagster-env-config
          imagePullPolicy: Never
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster/home/dagster.yaml
              subPath: dagster.yaml
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-config
