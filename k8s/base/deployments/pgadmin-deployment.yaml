apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: dagster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      serviceAccountName: dagster-user-code
      containers:
        - name: pgadmin
          image: dpage/pgadmin4
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: pgadmin-secret
