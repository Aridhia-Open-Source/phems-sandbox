apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dagster
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: phems-dagster:v106
          command: [
            "dagster-celery", "worker", "start",
            "--app", "app.worker",
            "--loglevel", "INFO",
            "--queue", "dagster"
          ]
          envFrom:
            - configMapRef:
                name: dagster-env-config
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster/home/dagster.yaml
              subPath: dagster.yaml
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-config
