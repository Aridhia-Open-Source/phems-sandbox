apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-job-config
  namespace: dagster
data:
  job_spec.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: dagster-job-config
    spec:
      template:
        metadata:
          labels:
            app: worker
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: phems-dagster:v53
              command: [
                "dagster-celery", "worker",
                "--app", "app.worker",
                "--loglevel", "INFO",
                "--concurrency", "1",
                "--queues", "dagster"
              ]
              envFrom:
                - configMapRef:
                    name: dagster-env-config
              volumeMounts:
                - name: dagster-config
                  mountPath: /opt/dagster/home/dagster.yaml
                  subPath: dagster.yaml
          volumes:
            - name: dagster-config
              configMap:
                name: dagster-config
